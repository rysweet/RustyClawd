[package]
name = "rustyclawd-sdk"
version = "0.1.0"
edition = "2021"

[lib]
name = "claude_agent_sdk"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.22", features = ["extension-module", "abi3-py38"] }
rustyclawd-core = { path = "../crates/core" }
tokio = { workspace = true, features = ["rt", "rt-multi-thread"] }
serde_json = { workspace = true }
