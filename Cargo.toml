[workspace]
resolver = "2"
members = [
    "crates/cli",
    "crates/core",
    "crates/memory",
    "crates/tools",
    "tools/testing",
]
exclude = ["# python-sdk"]

[workspace.package]
version = "0.1.1"
edition = "2021"
license = "MIT OR Apache-2.0"
authors = ["RustyClawd Contributors"]
repository = "https://github.com/rysweet/RustyClawd"

[workspace.dependencies]
# Async runtime
tokio = { version = "1.35", features = ["full"] }
tokio-util = "0.7"

# CLI
clap = { version = "4.4", features = ["derive", "cargo", "env"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Error handling
anyhow = "1.0"
thiserror = "2.0"

# Async utilities
futures = "0.3"
async-stream = "0.3"
async-trait = "0.1"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# HTTP client
reqwest = { version = "0.13", features = ["json", "stream"] }

# Validation
validator = { version = "0.20", features = ["derive"] }

# Process management (part of tokio)
# Terminal UI
crossterm = "0.29"

# Time handling
chrono = { version = "0.4", features = ["serde"] }

# Unix process management (conditional)
libc = "0.2"

[patch.crates-io]
tui-textarea = { git = "https://github.com/0xferrous/tui-textarea", rev = "a5086767ee0831e319aec9432aaef495d8f280c4" }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
