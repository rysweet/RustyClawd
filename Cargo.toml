[workspace]
resolver = "2"
members = [
    "crates/cli",
    "crates/core",
    "crates/tools",
]
exclude = ["python-sdk"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
authors = ["Claude Code Rust Translation Project"]
repository = "https://github.com/yourusername/claude-code-rs"

[workspace.dependencies]
# Async runtime
tokio = { version = "1.35", features = ["full"] }
tokio-util = "0.7"

# CLI
clap = { version = "4.4", features = ["derive", "cargo"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Error handling
anyhow = "1.0"
thiserror = "1.0"

# Async utilities
futures = "0.3"
async-stream = "0.3"
async-trait = "0.1"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# HTTP client
reqwest = { version = "0.11", features = ["json", "stream"] }

# Validation
validator = { version = "0.16", features = ["derive"] }

# Process management (part of tokio)
# Terminal UI
crossterm = "0.27"

# Time handling
chrono = "0.4"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
