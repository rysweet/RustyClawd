name: E2E Tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:  # Allow manual triggers

permissions:
  contents: read

jobs:
  e2e-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 60  # Increased from 30 to accommodate 28 test scenarios
    
    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      
      - name: Install Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
      
      - name: Cache Cargo dependencies
        uses: actions/cache@6f8efc29b200d32929f49075959781ed54ec270c # v3.5.0
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-
      
      - name: Build rusty binary
        run: |
          cargo build --release --bin rusty
          echo "Binary built at: target/release/rusty"
          ls -lah target/release/rusty
      
      - name: Install Python dependencies
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install pyyaml
      
      - name: Install tmux (required for E2E tests)
        run: |
          sudo apt-get update
          sudo apt-get install -y tmux
      
      - name: Run E2E tests
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          RUST_BACKTRACE: 1
          RUSTYCLAWD_BIN: ${{ github.workspace }}/target/release/rusty
        run: |
          if [ -z "$ANTHROPIC_API_KEY" ]; then
            echo "⚠️ ANTHROPIC_API_KEY is not configured as a repository secret"
            echo "E2E tests will be skipped. Configure the secret to enable automated testing."
            echo "See: Settings → Secrets and variables → Actions → New repository secret"
            exit 0
          fi
          cd tests/e2e/scenarios
          python3 runner.py --verbose
      
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: e2e-test-results
          path: |
            tests/e2e/scenarios/screenshots/
            tests/e2e/scenarios/*.log
          retention-days: 7
      
      - name: Upload test logs on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: e2e-test-logs-failure
          path: |
            tests/e2e/scenarios/*.log
            /tmp/tmux-*.log
          retention-days: 14
