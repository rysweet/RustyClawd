name: Release

on:
  push:
    tags:
      - 'v*'
  # Allow the release build matrix to be exercised on a branch without cutting
  # a real tag. On workflow_dispatch the "Create GitHub Release" job is skipped
  # (it is gated on tag refs), so dispatch runs are build-only smoke tests.
  workflow_dispatch: {}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  # Extract version from tag
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Extract version from tag
        id: version
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Building release for version: ${VERSION}"

  # Build multi-platform binaries
  build:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: macos-latest
            target: x86_64-apple-darwin
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          key: ${{ matrix.target }}

      - name: Install OpenSSL (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get install -y pkg-config libssl-dev

      - name: Build release binary
        run: cargo build --release --target ${{ matrix.target }} --bin rusty

      - name: Package (Unix)
        if: runner.os != 'Windows'
        run: |
          mkdir -p dist
          cp target/${{ matrix.target }}/release/rusty dist/rusty-${{ matrix.target }}
          cd dist
          tar czf rusty-${{ matrix.target }}.tar.gz rusty-${{ matrix.target }}

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          mkdir -p dist
          cp target/${{ matrix.target }}/release/rusty.exe dist/rusty-${{ matrix.target }}.exe
          cd dist
          tar czf rusty-${{ matrix.target }}.tar.gz rusty-${{ matrix.target }}.exe

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: binaries-${{ matrix.target }}
          path: dist/rusty-${{ matrix.target }}.tar.gz

  # Create GitHub Release with all artifacts
  release:
    needs: [prepare, build]
    # Only publish a GitHub Release for real tag pushes. workflow_dispatch runs
    # exercise the build matrix only and must not create releases.
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: release
          merge-multiple: true

      - name: Create GitHub Release
        run: |
          VERSION="${{ needs.prepare.outputs.version }}"
          TAG="v${VERSION}"

          ls -la release/

          gh release create "${TAG}" \
            --title "RustyClawd v${VERSION}" \
            --generate-notes \
            --notes-start-tag "$(git describe --tags --abbrev=0 HEAD~1 2>/dev/null || echo '')" \
            release/rusty-*.tar.gz || \
          gh release create "${TAG}" \
            --title "RustyClawd v${VERSION}" \
            --notes "## RustyClawd v${VERSION}

          Pre-built binaries for all platforms.

          ### Install via cargo
          \`\`\`bash
          cargo install --git https://github.com/rysweet/RustyClawd.git --bin rusty rustyclawd-cli
          \`\`\`

          ### Self-update
          \`\`\`bash
          rusty update
          \`\`\`" \
            release/rusty-*.tar.gz
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
