name: Claude Code Sync Monitor

on:
  # Run weekly on Monday at 9 AM UTC
  schedule:
    - cron: '0 9 * * 1'

  # Allow manual triggering
  workflow_dispatch:

permissions:
  issues: write
  contents: read

jobs:
  sync-monitor:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2

      - name: Build sync monitor
        run: cargo build --release --package rustyclawd-tools

      - name: Run sync monitor
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INVENTORY_PATH: .claude/data/feature_inventory.yaml
          LEDGER_PATH: .claude/data/sync_ledger.json
        run: |
          cargo run --package rustyclawd-tools --example claude_code_sync_cli -- \
            --inventory "$INVENTORY_PATH" \
            --ledger "$LEDGER_PATH" \
            --token "$GITHUB_TOKEN" \
            --repo "$GITHUB_REPOSITORY"

      - name: Upload ledger artifact
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: sync-ledger
          path: .claude/data/sync_ledger.json
          if-no-files-found: ignore
