# YAML Scenario: Permission Mode Toggle (Shift+Tab)
#
# Tests the new Permission Mode Toggle feature (Issue #108)
# Validates Shift+Tab cycling: Ask -> AutoAccept -> Plan -> Ask

scenario:
  name: "Permission Mode Toggle with Shift+Tab"
  description: "Validate permission mode cycling and tool restrictions"
  type: tui
  tags: [permission-mode, keyboard, shift-tab, plan-mode]
  status: "ready"

  environment:
    terminal_size:
      width: 120
      height: 40
    timeout: 60s

  steps:
    # Startup in default (Ask) mode
    - action: launch
      description: "Start RustyClawd"
      target: "cargo run --bin rusty"
      timeout: 15s

    - action: wait_for_text
      description: "Wait for TUI to load"
      contains: "RustyClawd"
      timeout: 5s

    # Test 1: Shift+Tab to AutoAccept mode
    - action: send_key
      description: "Press Shift+Tab to cycle to AutoAccept"
      key: "BackTab"
      timeout: 2s

    - action: sleep
      description: "Wait for mode change"
      duration: 2s

    # Test 2: Shift+Tab to Plan mode
    - action: send_key
      description: "Press Shift+Tab again to cycle to Plan"
      key: "BackTab"
      timeout: 2s

    - action: sleep
      description: "Wait for mode change"
      duration: 2s

    # Test 3: Verify Plan mode blocks Write tool
    - action: send_input
      description: "Try to use Write tool in Plan mode"
      text: "Create a test file at /tmp/blocked.txt"
      submit: true

    - action: sleep
      description: "Wait for AI response"
      duration: 20s

    - action: wait_for_text
      description: "Should return to prompt"
      contains: "RustyClawd"
      timeout: 20s

    # Test 4: Verify Plan mode allows Read tool
    - action: send_input
      description: "Try to use Read tool in Plan mode"
      text: "Read the Cargo.toml file"
      submit: true

    - action: sleep
      description: "Wait for AI response"
      duration: 20s

    - action: wait_for_text
      description: "Should return to prompt"
      contains: "RustyClawd"
      timeout: 10s

    # Test 5: Cycle back to Ask mode
    - action: send_key
      description: "Press Shift+Tab to cycle back to Ask"
      key: "BackTab"
      timeout: 2s

    - action: sleep
      description: "Wait for mode change"
      duration: 2s

    # Capture final state
    - action: capture_screenshot
      description: "Capture permission mode cycling"
      filename: "permission_mode_toggle.txt"

    # Exit
    - action: send_input
      description: "Exit cleanly"
      text: "/exit"
      submit: true

  assertions:
    - type: text_present
      value: "RustyClawd"
      description: "Permission mode cycling completed successfully"

    - type: exit_clean
      description: "Session exits without errors"

  cleanup:
    - action: cleanup_test_files
      description: "No test files created (Write blocked)"

  notes: |
    This scenario validates Issue #108: Permission Mode Toggle

    Key behaviors tested:
    1. Shift+Tab cycles modes: Ask → AutoAccept → Plan → Ask
    2. Plan mode blocks modification tools (Write, Edit, Bash)
    3. Plan mode allows read-only tools (Read, Glob, Grep)
    4. Mode indicator visible in TUI
    5. Complete cycle back to Ask mode

    Matches Claude Code v2.0.61 behavior:
    - 76% token savings in Plan mode (documented benefit)
    - Clear mode switching UX
    - Proper tool restrictions

    **Sources**:
    - [Claude Code Terminal Setup](https://claudelog.com/faqs/claude-code-terminal-setup/)
    - [Keyboard Shortcuts](https://capacity.so/en/blog/how-to-use-claude-code-tips-and-shortcuts)
