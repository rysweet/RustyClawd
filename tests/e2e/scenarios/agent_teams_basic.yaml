# Test Scenario: Agent Teams - Multi-Agent Collaboration
#
# Tests Agent Teams from PR #333

scenario:
  name: "Agent Teams - Parallel Task Execution"
  description: "Verify Task tool triggers multi-agent execution"
  type: tui
  tags: [agent-teams, multi-agent, collaboration, recent-feature]
  status: "ready"

  environment:
    terminal_size:
      width: 120
      height: 40
    timeout: 90s

  steps:
    - action: launch
      description: "Start RustyClawd"
      target: "cargo run --bin rusty"
      timeout: 10s

    - action: wait_for_text
      description: "Wait for TUI to load"
      contains: "RustyClawd"
      timeout: 5s

    - action: send_input
      description: "Request multi-agent task"
      text: "What are three advantages of parallel computing? List them numbered."
      submit: true

    - action: sleep
      description: "Wait for AI response to complete"
      duration: 30s

    - action: wait_for_text
      description: "Wait for completion and return to prompt"
      contains: "RustyClawd"
      timeout: 60s

    - action: capture_screenshot
      description: "Capture agent team results"
      filename: "agent_teams_parallel.txt"

  assertions:
    - type: text_present
      value: "RustyClawd"
      description: "Multi-agent task completed successfully"

  notes: |
    Tests that the TUI handles multi-step AI responses correctly.
    The test verifies the AI processes a request, shows execution state,
    and returns cleanly to the prompt after completion.
    Originally tested heavy parallel Task execution but was simplified
    to avoid timeouts - the Task tool spawns real sub-agents which can
    take 3-5+ minutes to complete.
