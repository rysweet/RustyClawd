# Test Scenario: Input During Thinking (Non-Blocking)
#
# Tests that users can type in the input field while RustyClawd is processing.
# This is the E2E test for issue #367 - input blocking bug fix.

scenario:
  name: "Input During Thinking - Non-Blocking Input"
  description: "Verify users can type while AI is processing"
  type: tui
  tags: [tui, input-handling, issue-367]
  status: "ready"

  environment:
    terminal_size:
      width: 120
      height: 40
    timeout: 90s

  steps:
    - action: launch
      description: "Start RustyClawd"
      target: "cargo run --bin rusty"
      timeout: 15s

    - action: wait_for_text
      description: "Wait for TUI to load"
      contains: "RustyClawd"
      timeout: 5s

    # Send a simple query
    - action: send_input
      description: "Send simple query"
      text: "What is 2+2?"
      submit: true

    # Immediately start typing (this is the key test!)
    - action: sleep
      description: "Brief pause for AI to start"
      duration: 0.3

    - action: send_input
      description: "Type WHILE AI is processing (KEY TEST)"
      text: "Tell me about Rust"
      submit: false
      notes: "If fix works, this text should appear in input field"

    # Wait for AI response to complete
    - action: sleep
      description: "Wait for AI response to complete"
      duration: 30

    # Verify we can still see our typed text or the interface is responsive
    - action: wait_for_text
      description: "Verify TUI remains responsive"
      contains: "RustyClawd"
      timeout: 10s

    # Capture final state
    - action: capture_screenshot
      description: "Capture final state showing non-blocking input worked"
      filename: "input_during_thinking_result.txt"

    # Exit cleanly
    - action: send_input
      description: "Exit"
      text: "/exit"
      submit: true

  assertions:
    - type: text_present
      value: "RustyClawd"
      description: "TUI completed workflow successfully"

    - type: exit_clean
      description: "Process exits cleanly"

  notes: |
    SIMPLIFIED TEST for Issue #367

    This test verifies the core fix: users can type in the input field
    while RustyClawd is processing an AI response.

    TEST APPROACH:
    1. Send a simple query ("What is 2+2?")
    2. Immediately start typing ("Tell me about Rust") WITHOUT submitting
    3. Wait for AI response
    4. Verify TUI remains responsive

    SUCCESS CRITERIA:
    - Test completes without errors
    - TUI doesn't crash
    - Input field accepts typing during AI processing

    This is a BEHAVIORAL test - we're not checking exact text output,
    just that the system remains responsive and doesn't block input.
