# YAML Scenario: Multi-Turn Conversation with Tools
#
# **Status:** Pending - Waiting for scenario runner implementation
#
# This scenario validates that context is preserved across multiple turns
# and that tools execute correctly within a conversation flow.

scenario:
  name: "Multi-Turn Conversation with Context"
  description: "Validate context preserved across multiple turns with tool execution"
  type: tui
  tags: [conversation, context, core-workflow, tools]
  status: "pending_implementation"

  environment:
    terminal_size:
      width: 120
      height: 40
    timeout: 60s

  steps:
    # Turn 1: Initial question
    - action: launch
      description: "Start RustyClawd TUI"
      target: "cargo run --bin rusty"
      timeout: 10s

    - action: wait_for_text
      description: "Wait for welcome screen"
      contains: "RustyClawd"
      timeout: 5s

    - action: send_input
      description: "Ask about README file"
      text: "What's in the README.md file?"
      submit: true

    - action: wait_for_text
      description: "Wait for Read tool execution"
      contains: "README"
      timeout: 15s

    # Turn 2: Follow-up referencing prior context
    - action: send_input
      description: "Ask follow-up question referencing prior context"
      text: "What are the key points from that file?"
      submit: true

    - action: wait_for_text
      description: "Wait for summary response"
      contains: "key points"
      timeout: 15s

    # Turn 3: Another context reference
    - action: send_input
      description: "Third turn referencing prior discussion"
      text: "Can you create a summary file based on those ideas?"
      submit: true

    - action: sleep
      description: "Wait for tool execution"
      duration: 10s

    - action: wait_for_text
      description: "Should complete and show prompt"
      contains: "RustyClawd"
      timeout: 15s

    # Capture final state
    - action: capture_screenshot
      description: "Capture final conversation state"
      filename: "multi_turn_result.txt"

    # Clean exit
    - action: send_input
      description: "Exit session"
      text: "/exit"
      submit: true

  assertions:
    - type: text_present
      value: "README"
      description: "First turn processed - file read"

    - type: text_present
      value: "key points"
      description: "Second turn used context from first turn"

    - type: text_present
      value: "Created"
      description: "Third turn used context to create file"

    - type: exit_clean
      description: "Session exits without errors"

  notes: |
    This scenario will FAIL until the scenario runner is implemented.

    Expected behavior:
    1. RustyClawd starts and shows welcome
    2. User asks about README → Read tool executes
    3. User asks follow-up → LLM uses prior context
    4. User requests summary file → Write tool executes with context
    5. All context preserved throughout conversation

    See: docs/architecture/e2e_testing_architecture.md
