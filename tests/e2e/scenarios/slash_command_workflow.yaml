# YAML Scenario: Slash Command Full Workflow
#
# **Status:** Pending - Waiting for scenario runner implementation
#
# This scenario validates complete slash command workflow from user input
# through command expansion, execution, and result display.

scenario:
  name: "Slash Command Full Workflow"
  description: "Validate /analyze command from user input to completion"
  type: tui
  tags: [slash-command, analyze, core-workflow]
  status: "pending_implementation"

  environment:
    terminal_size:
      width: 100
      height: 30
    timeout: 45s

  steps:
    # Startup
    - action: launch
      description: "Start RustyClawd TUI"
      target: "cargo run --bin rusty"
      timeout: 10s

    - action: wait_for_text
      description: "Wait for welcome message"
      contains: "RustyClawd"
      timeout: 5s

    # Execute slash command
    - action: send_input
      description: "Type /analyze slash command"
      text: "/analyze src/"
      submit: true

    - action: sleep
      description: "Wait for command to process"
      duration: 5s

    - action: wait_for_text
      description: "Should complete analysis"
      contains: "RustyClawd"
      timeout: 40s

    # Capture final state
    - action: capture_screenshot
      description: "Save final TUI state"
      filename: "slash_command_result.txt"

    # Exit
    - action: send_input
      description: "Exit cleanly"
      text: "/exit"
      submit: true

  assertions:
    - type: text_present
      value: "RustyClawd"
      description: "Slash command workflow completed successfully"

    - type: exit_clean
      description: "Session exits without errors"

  notes: |
    This scenario will FAIL until the scenario runner is implemented.

    Expected behavior:
    1. RustyClawd starts successfully
    2. User types /analyze src/
    3. SlashCommandTool invoked
    4. Command expanded and sent to LLM
    5. Analysis performed and results shown
    6. Clean exit

    See: docs/architecture/e2e_testing_architecture.md
