# Test Scenario: Binary Launch and Help
#
# Minimal smoke test to verify the binary launches and shows help

scenario:
  name: "Binary Launch Smoke Test"
  description: "Verify rusty binary launches and exits cleanly"
  type: tui
  tags: [smoke, quick]
  status: "ready"

  environment:
    terminal_size:
      width: 100
      height: 30
    timeout: 15s

  steps:
    # Test 1: Launch TUI normally
    - action: launch
      description: "Launch rusty in TUI mode"
      target: "cargo run --bin rusty"
      timeout: 10s

    - action: wait_for_text
      description: "Wait for TUI to appear"
      contains: "RustyClawd"
      timeout: 5s

    - action: send_input
      description: "Exit immediately"
      text: "/exit"
      submit: true

    - action: capture_screenshot
      description: "Capture TUI launch"
      filename: "help_output.txt"

  assertions:
    - type: exit_clean
      description: "Process exits cleanly"

  notes: |
    This is a minimal smoke test that doesn't require API key.
    Just verifies the binary builds and launches.
