# Test Scenario: Binary Launch and Help
#
# Minimal smoke test to verify the binary launches and shows help

scenario:
  name: "Binary Launch Smoke Test"
  description: "Verify rusty binary launches and exits cleanly"
  type: tui
  tags: [smoke, quick]
  status: "ready"

  environment:
    terminal_size:
      width: 100
      height: 30
    timeout: 15s

  steps:
    # Test 1: Launch normally and verify TUI starts
    - action: launch
      description: "Launch rusty in TUI mode"
      timeout: 10s

    - action: wait_for_text
      description: "Wait for TUI to appear"
      contains: "RustyClawd"
      timeout: 5s

    - action: capture_screenshot
      description: "Capture TUI startup"
      filename: "tui_startup.txt"
    
    - action: send_key
      description: "Exit with Escape"
      key: "Escape"

  assertions:
    - type: text_present
      value: "RustyClawd"
      description: "TUI launches and shows application name"

    - type: exit_clean
      description: "Process exits cleanly"

  notes: |
    This is a minimal smoke test that doesn't require API key.
    Just verifies the binary builds and launches in TUI mode.
