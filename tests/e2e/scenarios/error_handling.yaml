# YAML Scenario: Error Handling and Recovery
#
# **Status:** Pending - Waiting for scenario runner implementation
#
# This scenario validates graceful error handling and recovery,
# ensuring the system remains functional after errors.

scenario:
  name: "Error Handling and Recovery"
  description: "Validate graceful error handling and system recovery"
  type: tui
  tags: [error-handling, recovery, robustness]
  status: "pending_implementation"

  environment:
    terminal_size:
      width: 100
      height: 30
    timeout: 45s

  steps:
    # Startup
    - action: launch
      description: "Start RustyClawd"
      target: "cargo run --bin rusty"
      timeout: 10s

    - action: wait_for_text
      description: "Wait for ready state"
      contains: "RustyClawd"
      timeout: 5s

    # Error 1: Invalid slash command
    - action: send_input
      description: "Send invalid slash command"
      text: "/nonexistent"
      submit: true

    - action: sleep
      description: "Wait for AI response to complete"
      duration: 10

    - action: wait_for_text
      description: "Should show error message"
      contains: "RustyClawd"
      timeout: 5s

    # Recovery 1: Valid command after error
    - action: send_input
      description: "Send valid command after error"
      text: "/help"
      submit: true

    - action: sleep
      description: "Wait for AI response to complete"
      duration: 10

    - action: wait_for_text
      description: "Should show help (recovery successful)"
      contains: "RustyClawd"
      timeout: 5s

    # Error 2: Tool failure (nonexistent file)
    - action: send_input
      description: "Request nonexistent file"
      text: "Read the file /nonexistent/path.txt"
      submit: true

    - action: sleep
      description: "Wait for AI response to complete"
      duration: 15s

    - action: wait_for_text
      description: "Should return to prompt"
      contains: "RustyClawd"
      timeout: 10s

    # Recovery 2: Normal operation after tool error
    - action: send_input
      description: "Normal request after tool error"
      text: "What's 2+2?"
      submit: true

    - action: sleep
      description: "Wait for AI response to complete"
      duration: 10

    - action: wait_for_text
      description: "Should respond normally (recovery successful)"
      contains: "4"
      timeout: 10s

    # Capture final state
    - action: capture_screenshot
      description: "Capture final state showing recovery"
      filename: "error_handling_result.txt"

    # Exit
    - action: send_input
      description: "Exit"
      text: "/exit"
      submit: true

  assertions:
    - type: text_present
      value: "RustyClawd"
      description: "Session still functional after multiple errors"

    - type: exit_clean
      description: "Session still functional after multiple errors"

  notes: |
    This scenario will FAIL until the scenario runner is implemented.

    Expected behavior:
    1. Invalid slash command → Error message
    2. Valid command works after error (recovery)
    3. Tool failure → Error message
    4. Normal operation works after tool error (recovery)
    5. System remains stable throughout

    Key validation: Error handling doesn't break the session.

    See: docs/architecture/e2e_testing_architecture.md
