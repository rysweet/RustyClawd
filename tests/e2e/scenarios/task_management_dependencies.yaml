# Test Scenario: Task Management - Dependencies
#
# Tests task dependency tracking from PR #335

scenario:
  name: "Task Management - Dependency Validation"
  description: "Verify tasks with dependencies can't be completed out of order"
  type: tui
  tags: [task-management, dependencies, validation, edge-case]
  status: "ready"

  environment:
    terminal_size:
      width: 120
      height: 40
    timeout: 90s

  steps:
    - action: launch
      description: "Start RustyClawd"
      target: "cargo run --bin rusty"
      timeout: 10s

    - action: wait_for_text
      description: "Wait for TUI to load"
      contains: "RustyClawd"
      timeout: 5s

    - action: send_input
      description: "Create tasks with dependencies"
      text: "Create 3 tasks: Task A (setup environment), Task B (run tests - depends on A), Task C (deploy - depends on B). Set up the dependencies correctly."
      submit: true

    - action: sleep
      description: "Wait for task creation response to complete"
      duration: 15s

    - action: wait_for_text
      description: "Should show RustyClawd interface"
      contains: "RustyClawd"
      timeout: 30s

    - action: send_input
      description: "Try to complete Task C before dependencies"
      text: "Mark Task C as completed."
      submit: true

    - action: sleep
      description: "Wait for AI response about dependencies"
      duration: 15s

    - action: wait_for_text
      description: "Should show RustyClawd interface"
      contains: "RustyClawd"
      timeout: 30s

    - action: send_input
      description: "Complete tasks in correct order"
      text: "Complete Task A first, then Task B, then Task C."
      submit: true

    - action: wait_for_text
      description: "Should complete successfully"
      contains: "completed"
      timeout: 20s

    - action: capture_screenshot
      description: "Capture dependency validation"
      filename: "task_dependencies.txt"

  assertions:
    - type: interface_present
      value: "RustyClawd"
      description: "Task dependency workflow completed successfully"

  notes: |
    Tests dependency validation in task management.
    Should prevent completing tasks when dependencies aren't met.
    Should allow completion when dependencies are satisfied.
