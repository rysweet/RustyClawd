# YAML Scenario: Complex Agentic Task Workflow
#
# This scenario validates multi-step tool use with context preservation
# using a controlled fixture instead of a long repo-wide analysis prompt.

scenario:
  name: "Complex Agentic Task Workflow"
  description: "Validate multi-step agentic workflow with context and tools"
  type: tui
  tags: [agentic, multi-step, complex, tools]
  status: "ready"

  environment:
    terminal_size:
      width: 120
      height: 40
    timeout: 75s

  steps:
    - action: remove_file
      description: "Remove stale summary file from prior runs"
      path: "/tmp/agentic_summary.md"

    - action: ensure_file
      description: "Create controlled source content"
      path: "/tmp/agentic_components.txt"
      content: |
        parser: parses commands
        runner: executes workflows
        reporter: summarizes results

    # Startup
    - action: launch
      description: "Start RustyClawd"
      target: "cargo run --bin rusty"
      timeout: 15s

    - action: wait_for_text
      description: "Wait for ready"
      contains: "RustyClawd"
      timeout: 5s

    # Step 1: Initial analysis request
    - action: send_input
      description: "Request analysis of controlled source file"
      text: "Read /tmp/agentic_components.txt and reply with the three component names only, comma-separated, in the same order they appear."
      submit: true

    - action: sleep
      description: "Wait for AI response to complete"
      duration: 25

    - action: wait_for_text
      description: "Wait for first answer to include parser"
      contains: "parser"
      timeout: 20s

    # Step 2: Follow-up based on analysis
    - action: send_input
      description: "Create summary file using prior context"
      text: "Using the exact same three names from your previous answer, create /tmp/agentic_summary.md with the heading '# Components' and one markdown bullet per component."
      submit: true

    - action: sleep
      description: "Wait for AI response to complete"
      duration: 35

    # Step 3: Action based on understanding
    - action: send_input
      description: "Verify created file using exact success token"
      text: "Read /tmp/agentic_summary.md. If it contains the heading '# Components' and bullets for parser, runner, and reporter, reply with exactly CONTEXT_OK."
      submit: true

    - action: sleep
      description: "Wait for AI response to complete"
      duration: 25

    - action: wait_for_text
      description: "Wait for exact verification response"
      contains: "CONTEXT_OK"
      timeout: 30s

    # Capture final state
    - action: capture_screenshot
      description: "Capture complete workflow"
      filename: "agentic_task_result.txt"

    # Exit
    - action: send_input
      description: "Exit"
      text: "/exit"
      submit: true

  assertions:
    - type: text_present
      value: "CONTEXT_OK"
      description: "Complex workflow preserved context through read, write, and verify steps"

    - type: file_exists
      path: "/tmp/agentic_summary.md"
      description: "Workflow created the summary file"

    - type: exit_clean
      description: "Complex workflow completes successfully"

  notes: |
    This scenario uses a deterministic fixture so it can still validate:
    1. Read tool execution against a real file
    2. Multi-turn context preservation across turns
    3. Write tool execution based on prior model output
    4. Final verification via an exact success token

    The goal is to exercise agentic flow without depending on a long,
    timing-sensitive repo analysis prompt.
