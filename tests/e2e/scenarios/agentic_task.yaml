# YAML Scenario: Complex Agentic Task Workflow
#
# **Status:** Pending - Waiting for scenario runner implementation
#
# This scenario validates complex multi-agent workflows with tool use,
# context preservation, and multi-step reasoning.

scenario:
  name: "Complex Agentic Task Workflow"
  description: "Validate multi-step agentic workflow with context and tools"
  type: tui
  tags: [agentic, multi-step, complex, tools]
  status: "pending_implementation"

  environment:
    terminal_size:
      width: 120
      height: 40
    timeout: 90s

  steps:
    # Startup
    - action: launch
      description: "Start RustyClawd"
      target: "cargo run --bin rusty"
      timeout: 15s

    - action: wait_for_text
      description: "Wait for ready"
      contains: "RustyClawd"
      timeout: 5s

    # Step 1: Initial analysis request
    - action: send_input
      description: "Request codebase analysis"
      text: "Analyze the crates/cli/src directory and summarize the architecture"
      submit: true

    - action: sleep
      description: "Wait for AI response to complete"
      duration: 120

    - action: wait_for_text
      description: "Wait for Read tool execution (multiple files)"
      contains: "RustyClawd"
      timeout: 120s

    # Step 2: Follow-up based on analysis
    - action: send_input
      description: "Ask follow-up based on analysis"
      text: "Based on that analysis, what are the main components?"
      submit: true

    - action: sleep
      description: "Wait for AI response to complete"
      duration: 150

    - action: wait_for_text
      description: "Wait for summary using prior context"
      contains: "RustyClawd"
      timeout: 90s

    # Step 3: Action based on understanding
    - action: send_input
      description: "Request document creation based on understanding"
      text: "Create a tests/SUMMARY.md file documenting those components"
      submit: true

    - action: sleep
      description: "Wait for AI response to complete"
      duration: 120

    - action: wait_for_text
      description: "Wait for Write tool execution"
      contains: "RustyClawd"
      timeout: 90s

    # Step 4: Verification
    - action: send_input
      description: "Verify the created file"
      text: "Read tests/SUMMARY.md to confirm it was created correctly"
      submit: true

    - action: sleep
      description: "Wait for AI response to complete"
      duration: 120

    - action: wait_for_text
      description: "Wait for Read tool to show file contents"
      contains: "RustyClawd"
      timeout: 60s

    # Capture final state
    - action: capture_screenshot
      description: "Capture complete workflow"
      filename: "agentic_task_result.txt"

    # Exit
    - action: send_input
      description: "Exit"
      text: "/exit"
      submit: true

  assertions:
    - type: file_exists
      path: "tests/SUMMARY.md"
      description: "Output file actually created"

    - type: exit_clean
      description: "Complex workflow completes successfully"

  cleanup:
    - action: remove_file
      path: "tests/SUMMARY.md"
      description: "Clean up created test file"

  notes: |
    This scenario will FAIL until the scenario runner is implemented.

    Expected behavior:
    1. User requests analysis → Multiple Read tools
    2. User asks follow-up → LLM uses analysis context
    3. User requests document → Write tool with context
    4. User verifies → Read tool confirms creation
    5. All context flows correctly through multi-step workflow

    This tests TRUE agentic behavior:
    - Multi-step reasoning
    - Tool use at each step
    - Context preservation throughout
    - Task decomposition and execution

    See: docs/architecture/e2e_testing_architecture.md
