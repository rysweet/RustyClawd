# Test Scenario: Extended Thinking Phase - Cancellation
#
# Tests that extended thinking can be cancelled mid-stream

scenario:
  name: "Extended Thinking - Cancel During Thinking"
  description: "Verify Ctrl+C works during extended thinking phase"
  type: tui
  tags: [extended-thinking, cancellation, edge-case]
  status: "ready"

  environment:
    terminal_size:
      width: 120
      height: 40
    timeout: 30s

  steps:
    - action: launch
      description: "Start RustyClawd"
      target: "cargo run --bin rusty"
      timeout: 10s

    - action: wait_for_text
      description: "Wait for TUI to load"
      contains: "RustyClawd"
      timeout: 5s

    - action: send_input
      description: "Ask very complex question to trigger long thinking"
      text: "Please write a comprehensive analysis of quantum computing, covering quantum superposition, entanglement, quantum gates, error correction, current hardware implementations, and future prospects. Include mathematical foundations and practical applications."
      submit: true

    - action: sleep
      description: "Let AI start processing"
      duration: 3s

    - action: send_keys
      description: "Send Ctrl+C to cancel"
      keys: "C-c"

    - action: wait_for_text
      description: "Should show RustyClawd interface"
      contains: "RustyClawd"
      timeout: 10s

    - action: capture_screenshot
      description: "Capture cancelled state"
      filename: "extended_thinking_cancelled.txt"

  assertions:
    - type: text_present
      value: "RustyClawd"
      description: "Returns to prompt after cancel"

  notes: |
    Tests cancellation during extended thinking.
    User should be able to interrupt long thinking phases.
    System should recover gracefully and return to prompt.
