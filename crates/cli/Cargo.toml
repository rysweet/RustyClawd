[package]
name = "rustyclawd-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[lib]
name = "rustyclawd"
path = "src/lib.rs"

[[bin]]
name = "rusty"
path = "src/main.rs"

[dependencies]
# Workspace crates
rustyclawd-core = { path = "../core" }
rustyclawd-tools = { path = "../tools" }

# Workspace dependencies
tokio = { workspace = true }
clap = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
serde_json = { workspace = true }
futures = { workspace = true }
serde = { workspace = true }
reqwest = { workspace = true }
thiserror = { workspace = true }
chrono = { workspace = true }
secrecy = "0.10"
http = "1.3"

# Interactive mode
rustyline = "17.0"
ratatui = "0.30"
crossterm = "0.29"
tui-input = "0.15"
unicode-segmentation = "1.12"
unicode-width = "0.2"
tui-scrollview = "0.6"
tui-textarea = "0.7"
rat-focus = "2.0"
rat-event = "2.0"
textwrap = "0.16"

# Slash command support
serde_yaml = "0.9"
toml = "1.0"
dirs = "6.0"

# Update mechanism - Phase 2
sha2 = "0.10"
tempfile = "3.8"

[dev-dependencies]
# CLI testing
assert_cmd = "2.0"
predicates = "3.0"
tempfile = "3.8"
escargot = "0.5"
serial_test = "3.0"
uuid = { version = "1.11", features = ["v4"] }

# HTTP testing
wiremock = "0.6"

# Unix process management (for process group killing on timeout)
[target.'cfg(unix)'.dependencies]
libc = { workspace = true }
